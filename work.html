<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>การแข่งขันวอลเลย์บอล</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121824;
            background-image: linear-gradient(rgba(18, 24, 36, 0.72), rgba(18, 24, 36, 0.72)), url("K vs N.webp");
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            color: #ffcc00;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.4);
            font-size: 2.2rem;
        }

        .scoreboard-container {
            background: #1e293b;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 750px;
            border: 2px solid #334155;
        }

        .teams-container {
            display: flex;
            justify-content: space-between;
            gap: 25px;
        }

        .team-card {
            flex: 1;
            background: #0f172a;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            border-bottom: 6px solid #ccc;
            transition: all 0.3s ease;
        }

        .team-a { border-color: #ff0000; } 
        .team-b { border-color: #ff8800; } 

        .team-name {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .team-a .team-name { color: #ff0000; }
        .team-b .team-name { color: #ff8800; }

        /* ส่วนแสดงจำนวนเซตที่ชนะ */
        .set-counter {
            font-size: 1rem;
            color: #94a3b8;
            margin-bottom: 15px;
            background: #1e293b;
            display: inline-block;
            padding: 4px 15px;
            border-radius: 20px;
            font-weight: bold;
        }
        .set-counter span {
            color: #ef4444;
            font-size: 1.2rem;
        }

        .score-display {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 6rem;
            font-weight: bold;
            background: #020617;
            padding: 10px 0;
            border-radius: 10px;
            margin-bottom: 20px;
            color: #ffffff;
            letter-spacing: 2px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }
        .team-a .score-display { color: #ff0000; text-shadow: 0 0 15px rgba(255, 0, 0, 0.5); }
        .team-b .score-display { color: #ff8800; text-shadow: 0 0 15px rgba(255, 136, 0, 0.5); }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            color: white;
            border: none;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-add {
            flex: 2;
            padding: 12px;
            font-size: 1.2rem;
        }
        .team-a .btn-add { background: #ff0000; }
        .team-b .btn-add { background: #ff8800; }

        .btn-minus {
            flex: 1;
            padding: 12px;
            font-size: 1.2rem;
            background: #475569;
        }
        .btn-minus:hover { background: #64748b; }

        .control-panel {
            margin-top: 35px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .action-btn {
            width: 100%;
            max-width: 320px;
            padding: 14px;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-winner {
            background: #10b981;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        .btn-winner:hover { background: #059669; }

        .btn-reset {
            background: #ef4444;
        }
        .btn-reset:hover { background: #dc2626; }

        .winner-announcement {
            margin-top: 25px;
            font-size: 1.6rem;
            font-weight: bold;
            text-align: center;
            min-height: 45px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <h1>การแข่งขันวอลเลย์บอล</h1>

    <div class="scoreboard-container">
        <div class="teams-container">
            <!-- ทีม A -->
            <div class="team-card team-a">
                <div class="team-name">Nekoma High </div>
                <div class="set-counter">เซตที่ได้: <span id="set-a">0</span></div>
                <div class="score-display" id="score-a">00</div>
                <div class="btn-group">
                    <button class="btn-minus" onclick="changeScore('a', -1)">-</button>
                    <button class="btn-add" onclick="changeScore('a', 1)">+1 แต้ม</button>
                </div>
            </div>

            <!-- ทีม B -->
            <div class="team-card team-b">
                <div class="team-name">Karasuno High</div>
                <div class="set-counter">เซตที่ได้: <span id="set-b">0</span></div>
                <div class="score-display" id="score-b">00</div>
                <div class="btn-group">
                    <button class="btn-minus" onclick="changeScore('b', -1)">-</button>
                    <button class="btn-add" onclick="changeScore('b', 1)">+1 แต้ม</button>
                </div>
            </div>
        </div>

        <!-- แผงควบคุมระบบ -->
        <div class="control-panel">
            <button class="action-btn btn-winner" onclick="declareWinner()">ประกาศผู้ชนะการแข่งขัน</button>
            <button class="action-btn btn-reset" onclick="resetScoreboard()">รีเซ็ตทั้งหมด</button>
        </div>

        
        <div class="winner-announcement" id="winner-text"></div>
    </div>

    <script>
        let scoreA = 0;
        let scoreB = 0;
        let setA = 0;
        let setB = 0;

        
        function changeScore(team, value) {
            if (team === 'a') {
                scoreA += value;
                if (scoreA < 0) scoreA = 0; 
                document.getElementById('score-a').innerText = String(scoreA).padStart(2, '0');
            } else if (team === 'b') {
                scoreB += value;
                if (scoreB < 0) scoreB = 0; 
                document.getElementById('score-b').innerText = String(scoreB).padStart(2, '0');
            }
            checkSetWinner();
            
            document.getElementById('winner-text').innerText = "";
        }
        function checkSetWinner() {
            if (scoreA >= 25 && (scoreA - scoreB) >= 2) {
                setA++;
                document.getElementById('set-a').innerText = setA;
                resetCurrentSetScore();
            } else if (scoreB >= 25 && (scoreB - scoreA) >= 2) {
                setB++;
                document.getElementById('set-b').innerText = setB;
                resetCurrentSetScore();
            }
        }

        function resetCurrentSetScore() {
            scoreA = 0;
            scoreB = 0;
            document.getElementById('score-a').innerText = "00";
            document.getElementById('score-b').innerText = "00";
        }

        function declareWinner() {
            const winnerTextElement = document.getElementById('winner-text');
            
            if (setA > setB) {
                winnerTextElement.style.color = "#38bdf8";
                winnerTextElement.innerText = " Nekoma High ชนะการแข่งขันแมตช์นี้! ";
            } else if (setB > setA) {
                winnerTextElement.style.color = "#ff8800";
                winnerTextElement.innerText = " Karasuno High ชนะการแข่งขันแมตช์นี้! ";
            } else {
                
                if (scoreA > scoreB) {
                    winnerTextElement.style.color = "#ff0000";
                    winnerTextElement.innerText = " Nekoma High นำอยู่ในเซตนี้ ";
                } else if (scoreB > scoreA) {
                    winnerTextElement.style.color = "#ff8800";
                    winnerTextElement.innerText = " Karasuno High นำอยู่ในเซตนี้ ";
                } else {
                    winnerTextElement.style.color = "#ffffff";
                    winnerTextElement.innerText = " คะแนนปัจจุบันยังเสมอกันอยู่ ";
                }
            }
        }
        function resetScoreboard() {
            scoreA = 0;
            scoreB = 0;
            setA = 0;
            setB = 0;
            document.getElementById('score-a').innerText = "00";
            document.getElementById('score-b').innerText = "00";
            document.getElementById('set-a').innerText = "0";
            document.getElementById('set-b').innerText = "0";
            document.getElementById('winner-text').innerText = "";
        }
    </script>
</body>
</html>
